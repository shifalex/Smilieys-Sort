<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetting Smileys Sorting Game</title>
    <style>
      body { font: 20px system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #17476b; }
      p { padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <p>Refreshing the game for Safari…</p>
    <script>
      Promise.all([
        "serviceWorker" in navigator
          ? navigator.serviceWorker.getRegistrations().then(items => Promise.all(items.map(item => item.unregister())))
          : Promise.resolve(),
        "caches" in window
          ? caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))))
          : Promise.resolve()
      ]).finally(() => window.location.replace("./?ipad-reset=1"));
    </script>
  </body>
</html>
