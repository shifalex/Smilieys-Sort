<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f9f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smileys Sort">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Smileys Sorting Game</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="styles.css?v=average-variable-count-20260708">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <button class="back-button hidden" type="button" id="backButton" aria-label="Back to games">
          <span aria-hidden="true"></span>
        </button>
        <div>
          <p class="eyebrow hidden">Decomposition sorting</p>
          <h1 id="screenTitle">Smileys Sorting Game</h1>
        </div>
        <div class="top-actions">
          <div class="progress hidden" id="progressText"></div>
          <div class="mode-panel" id="modePanel" aria-label="Number mode">
            <button class="mode-choice numbers-mode" type="button" id="withNumbersButton" aria-label="With numbers">
              <span class="number-sketch n-one" aria-hidden="true">1</span>
              <span class="number-sketch n-two" aria-hidden="true">2</span>
              <span class="number-sketch n-three" aria-hidden="true">3</span>
            </button>
            <button class="mode-choice icons-mode" type="button" id="withoutNumbersButton" aria-label="Without numbers">
              <span class="choice-sketch sketch-face" aria-hidden="true"></span>
              <span class="choice-sketch sketch-hat" aria-hidden="true"></span>
              <span class="choice-sketch sketch-ears" aria-hidden="true"><span></span><span></span></span>
            </button>
          </div>
        </div>
      </header>

      <section class="setup-panel" id="setupPanel">
        <div class="home-smileys" aria-hidden="true">
          <span class="home-smiley home-smiley-one"></span>
          <span class="home-smiley home-smiley-two"></span>
          <span class="home-smiley home-smiley-three"></span>
          <span class="home-smiley home-smiley-four"></span>
          <span class="home-smiley home-smiley-five"></span>
          <span class="home-smiley home-smiley-six"></span>
          <span class="home-smiley home-smiley-seven"></span>
          <span class="home-smiley home-smiley-eight"></span>
        </div>
        <div class="mission-panel" id="missionPanel">
          <p class="home-greeting hidden">Hey, we are in the smileys sorting game :)</p>
          <h2 class="hidden">Choose mission</h2>
          <div class="mission-grid" aria-label="Choose mission">
            <button class="mission-choice feature-mission" type="button" id="featureMissionButton" aria-label="Feature Sort">
              <span class="feature-sort-sketch" aria-hidden="true">
                <span class="choice-sketch sketch-face"></span>
                <span class="feature-square-hat"><span></span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Feature Sort</span>
            </button>
            <button class="mission-choice carroll-mission" type="button" id="carrollMissionButton" aria-label="Two Feature Sort">
              <span class="carroll-sketch" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Two Feature Sort</span>
            </button>
            <button class="mission-choice venn-mission" type="button" id="vennMissionButton" aria-label="Circle Sort">
              <span class="venn-sketch" aria-hidden="true">
                <span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Circle Sort</span>
            </button>
            <button class="mission-choice selection-mission" type="button" id="selectionMissionButton" aria-label="Select from Venn">
              <span class="selection-sketch" aria-hidden="true">
                <span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Select</span>
            </button>
            <button class="mission-choice simple-compare-mission" type="button" id="simpleCompareMissionButton" aria-label="Easy Compare two smileys">
              <span class="compare-sketch" aria-hidden="true">
                <span></span><strong>V</strong><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Easy Compare</span>
            </button>
            <button class="mission-choice compare-mission" type="button" id="compareMissionButton" aria-label="Compare two smileys">
              <span class="compare-sketch" aria-hidden="true">
                <span></span><strong>=</strong><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Compare</span>
            </button>
            <button class="mission-choice creator-mission" type="button" id="creatorMissionButton" aria-label="Create smileys">
              <span class="creator-sketch" aria-hidden="true">
                <span></span><strong>+</strong>
              </span>
              <span class="mission-word" aria-hidden="true">Create</span>
            </button>
            <button class="mission-choice permutation-mission" type="button" id="permutationMissionButton" aria-label="Permutation Album">
              <span class="album-sketch" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Album</span>
            </button>
            <button class="mission-choice implicit-mission" type="button" id="implicitMissionButton" aria-label="Find the Rule">
              <span class="implicit-sketch" aria-hidden="true">
                <span>?</span><span>?</span>
              </span>
              <span class="mission-word" aria-hidden="true">Find the Rule</span>
            </button>
            <button class="mission-choice ordering-mission" type="button" id="orderingMissionButton" aria-label="Order">
              <span class="order-sketch" aria-hidden="true">
                <span class="order-letter">A</span>
                <span class="order-arrow"></span>
                <span class="order-letter">Z</span>
              </span>
              <span class="mission-word" aria-hidden="true">Order</span>
            </button>
            <button class="mission-choice statistics-mission" type="button" id="statisticsMissionButton" aria-label="Statistics">
              <span class="statistics-sketch" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Statistics</span>
            </button>
            <button class="mission-choice average-mission" type="button" id="averageMissionButton" aria-label="Average">
              <span class="average-sketch" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Average</span>
            </button>
          </div>
        </div>
        <div class="count-panel hidden" id="countPanel">
          <h2 class="hidden">How many smileys?</h2>
          <div class="count-grid" id="countGrid" aria-label="Choose number of smileys"></div>
        </div>
      </section>

      <section class="work-panel hidden" id="workPanel">
        <div class="tray-wrap">
          <p class="tray-label" id="trayLabel">Smileys</p>
          <div class="smiley-tray" id="tray" data-zone="tray"></div>
        </div>

        <div class="sort-table" id="sortTable">
          <div class="column-head with-feature" id="withHeader" aria-label="With the feature"></div>
          <div class="column-head without-feature" id="withoutHeader" aria-label="Without the feature"></div>
          <div class="drop-zone" id="withZone" data-zone="with" aria-label="Smileys with the feature"></div>
          <div class="drop-zone" id="withoutZone" data-zone="without" aria-label="Smileys without the feature"></div>
        </div>

        <div class="ordering-panel hidden" id="orderingPanel">
          <div class="ordering-head">
            <h2 class="panel-title">Order</h2>
            <div class="criteria-list" id="criteriaList" aria-label="Ordering criteria"></div>
          </div>
          <div class="ordering-zone" id="orderingZone" data-zone="order" aria-label="Ordered smileys"></div>
        </div>

        <div class="statistics-panel hidden" id="statisticsPanel">
          <div class="statistics-head">
            <h2 class="panel-title">Statistics</h2>
            <p class="statistics-instruction" id="statisticsInstruction"></p>
          </div>
          <div class="statistics-frequency" id="statisticsFrequency" aria-label="Beard frequency table"></div>
          <div class="statistics-order-wrap">
            <p class="statistics-ranking-direction" id="statisticsRankingDirection"></p>
            <div class="statistics-order-zone" id="statisticsOrderZone" data-zone="statistics-order" aria-label="Ordered statistics smileys"></div>
            <div class="statistics-coin-stage hidden" id="statisticsCoinStage">
              <div class="coin-bank" id="statisticsCoinBank" aria-label="Coin tray"></div>
              <div class="coin-share-row" id="statisticsCoinShares" aria-label="Equal coin shares"></div>
            </div>
          </div>
          <div class="statistics-weighted-table hidden" id="statisticsWeightedTable" aria-label="Weighted average table"></div>
          <p class="statistics-question" id="statisticsQuestion"></p>
          <div class="statistics-answer-row" id="statisticsAnswerRow" aria-label="Statistics answers"></div>
        </div>

        <div class="carroll-panel hidden" id="carrollPanel">
          <div class="carroll-table" id="carrollTable">
            <div class="carroll-corner" aria-hidden="true"></div>
            <div class="carroll-axis top-axis" id="carrollTopWith" aria-label="With first feature"></div>
            <div class="carroll-axis top-axis" id="carrollTopWithout" aria-label="Without first feature"></div>
            <div class="carroll-axis side-axis" id="carrollSideWith" aria-label="With second feature"></div>
            <div class="carroll-zone" id="carrollWithWithZone" data-zone="carroll-with-with" aria-label="Smileys with both features"></div>
            <div class="carroll-zone" id="carrollWithoutWithZone" data-zone="carroll-without-with" aria-label="Smileys without first feature and with second feature"></div>
            <div class="carroll-axis side-axis" id="carrollSideWithout" aria-label="Without second feature"></div>
            <div class="carroll-zone" id="carrollWithWithoutZone" data-zone="carroll-with-without" aria-label="Smileys with first feature and without second feature"></div>
            <div class="carroll-zone" id="carrollWithoutWithoutZone" data-zone="carroll-without-without" aria-label="Smileys without either feature"></div>
          </div>
        </div>

        <div class="compare-panel hidden" id="comparePanel">
          <div class="compare-faces" id="compareFaces" aria-label="Smileys to compare"></div>
          <div class="compare-drag-view" id="compareDragView">
            <div class="compare-column-head compare-bank-head" aria-hidden="true"></div>
            <div class="compare-column-head compare-symbol-head">=</div>
            <div class="compare-column-head compare-symbol-head">&ne;</div>
            <div class="criteria-bank" id="compareCriteriaBank" data-compare-zone="bank" aria-label="Criteria to compare"></div>
            <div class="compare-columns">
              <div class="compare-drop-zone" id="compareEqualZone" data-compare-zone="equal" aria-label="Equal criteria"></div>
              <div class="compare-drop-zone" id="compareDifferentZone" data-compare-zone="different" aria-label="Different criteria"></div>
            </div>
          </div>
        </div>

        <div class="simple-compare-panel hidden" id="simpleComparePanel">
          <div class="simple-compare-head">
            <h2 class="panel-title">Easy Compare</h2>
            <div class="simple-compare-faces" id="simpleCompareFaces" aria-label="Smileys to compare"></div>
          </div>
          <div class="simple-compare-table" id="simpleCompareTable" aria-label="Easy comparison table"></div>
        </div>

        <div class="permutation-panel hidden" id="permutationPanel">
          <div class="permutation-head">
            <h2 class="panel-title">Album</h2>
          </div>
          <div class="album-pages" id="albumPages" aria-label="Permutation photos"></div>
          <div class="permutation-capture-row">
            <div class="permutation-order-zone" id="permutationOrderZone" data-zone="permutation-order" aria-label="Order smileys for the photo"></div>
            <button class="camera-button" type="button" id="cameraButton" aria-label="Take photo of this order">
              <span aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="creator-panel hidden" id="creatorPanel">
          <div class="creator-head">
            <h2 class="panel-title">Create</h2>
          </div>
          <div class="creator-layout">
            <div class="creator-bank" id="creatorCriteriaBank" aria-label="Criteria to add"></div>
            <div class="creator-workbench">
              <div class="creator-current-tools">
                <div class="creator-smiley-target" id="creatorSmileyTarget" aria-label="Current smiley"></div>
                <button class="creator-reset-button" type="button" id="creatorResetButton" aria-label="Reset current smiley">
                  <span aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="created-smileys" id="createdSmileys" aria-label="Created smileys"></div>
          </div>
        </div>

        <div class="venn-panel hidden" id="vennPanel">
          <p class="selection-diagram-caption">Smileys</p>
          <div class="venn-stage" id="vennStage" aria-label="Three circle sorting diagram">
            <div class="venn-circle circle-a" aria-hidden="true">
              <div class="venn-circle-head" id="vennAHead"></div>
            </div>
            <div class="venn-circle circle-b" aria-hidden="true">
              <div class="venn-circle-head" id="vennBHead"></div>
            </div>
            <div class="venn-circle circle-c" aria-hidden="true">
              <div class="venn-circle-head" id="vennCHead"></div>
            </div>
            <div class="venn-zone zone-a-only" id="vennAZone" data-zone="venn-a" aria-label="Only first feature"></div>
            <div class="venn-zone zone-b-only" id="vennBZone" data-zone="venn-b" aria-label="Only second feature"></div>
            <div class="venn-zone zone-c-only" id="vennCZone" data-zone="venn-c" aria-label="Only third feature"></div>
            <div class="venn-zone zone-ab" id="vennABZone" data-zone="venn-ab" aria-label="First and second features"></div>
            <div class="venn-zone zone-ac" id="vennACZone" data-zone="venn-ac" aria-label="First and third features"></div>
            <div class="venn-zone zone-bc" id="vennBCZone" data-zone="venn-bc" aria-label="Second and third features"></div>
            <div class="venn-zone zone-abc" id="vennABCZone" data-zone="venn-abc" aria-label="All three features"></div>
            <div class="venn-zone zone-outside" id="vennOutsideZone" data-zone="venn-outside" aria-label="Outside all circles"></div>
          </div>
          <div class="selection-panel hidden" id="selectionPanel">
            <div class="selection-stage" id="selectionStage" aria-label="Select from the Venn diagram">
              <div class="selection-source">
                <div class="selection-caption" id="selectionCaption" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="selection-target-zone" id="selectionTargetZone" data-zone="selection-target" aria-label="Selection target"></div>
        </div>

        <div class="implicit-panel hidden" id="implicitPanel">
          <div class="implicit-stage" id="implicitStage" aria-label="Find the hidden circle rule">
            <div class="implicit-circle implicit-circle-a">
              <button class="implicit-rule-head" type="button" id="implicitAHead" aria-label="Choose left hidden rule"></button>
            </div>
            <div class="implicit-circle implicit-circle-b">
              <button class="implicit-rule-head" type="button" id="implicitBHead" aria-label="Choose right hidden rule"></button>
            </div>
            <div class="implicit-zone implicit-zone-a" id="implicitAZone" data-zone="implicit-a" aria-label="First hidden circle only"></div>
            <div class="implicit-zone implicit-zone-b" id="implicitBZone" data-zone="implicit-b" aria-label="Second hidden circle only"></div>
            <div class="implicit-zone implicit-zone-ab" id="implicitABZone" data-zone="implicit-ab" aria-label="Both hidden circles"></div>
            <div class="implicit-zone implicit-zone-outside" id="implicitOutsideZone" data-zone="implicit-outside" aria-label="Outside both hidden circles"></div>
            <div class="implicit-choice-list hidden" id="implicitChoiceList" aria-label="Choose hidden rule category"></div>
          </div>
        </div>

        <div class="action-row">
          <button class="primary-button submit-sort-button" type="button" id="submitSortButton">OK</button>
          <button class="secondary-button creator-finish-button" type="button" id="creatorFinishButton">Finish</button>
        </div>

      </section>
    </main>

    <div class="celebration hidden" id="celebration" aria-live="polite" aria-label="Correct cycle complete">
      <span class="firework firework-one" aria-hidden="true"></span>
      <span class="firework firework-two" aria-hidden="true"></span>
      <span class="firework firework-three" aria-hidden="true"></span>
      <span class="firework firework-four" aria-hidden="true"></span>
    </div>

    <template id="smileyTemplate">
      <button class="smiley" type="button">
        <span class="ear left-ear"></span>
        <span class="ear right-ear"></span>
        <span class="hat"></span>
        <span class="eye left-eye"></span>
        <span class="eye right-eye"></span>
        <span class="mouth"></span>
      </button>
    </template>

    <script type="module" src="app.js?v=average-variable-count-20260708"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
