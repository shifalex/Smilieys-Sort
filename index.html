<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f9f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smileys Sort">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Smileys Sorting Game</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="styles.css?v=ipad-feedback-v228-20260829">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <button class="back-button hidden" type="button" id="backButton" aria-label="Back to games">
          <span aria-hidden="true"></span>
        </button>
        <div>
          <p class="eyebrow hidden">Decomposition sorting</p>
          <h1 id="screenTitle">Smileys Sorting Game</h1>
        </div>
        <div class="top-actions">
          <div class="progress hidden" id="progressText"></div>
          <div class="settings-menu" id="settingsMenu">
            <button class="settings-button" type="button" id="settingsButton" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">
              <span class="settings-gear" aria-hidden="true"></span>
            </button>
            <div class="settings-panel hidden" id="settingsPanel" aria-label="Settings">
              <h2 class="visually-hidden">Settings</h2>
              <button class="settings-toggle" type="button" id="lightingSetting" role="switch" aria-label="Lighting" aria-checked="true" title="Lighting">
                <svg class="settings-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <circle cx="16" cy="16" r="5"></circle>
                  <path d="M16 3v5M16 24v5M3 16h5M24 16h5M6.8 6.8l3.6 3.6M21.6 21.6l3.6 3.6M25.2 6.8l-3.6 3.6M10.4 21.6l-3.6 3.6"></path>
                </svg>
              </button>
              <button class="settings-toggle" type="button" id="popupSetting" role="switch" aria-label="Intersection popups" aria-checked="true" title="Intersection popups">
                <svg class="settings-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <circle cx="11.5" cy="17" r="7.5"></circle>
                  <circle cx="20.5" cy="17" r="7.5"></circle>
                  <rect class="settings-icon-fill" x="12" y="5" width="8" height="7" rx="2"></rect>
                </svg>
              </button>
              <button class="settings-toggle" type="button" id="numbersSetting" role="switch" aria-label="Box numbers" aria-checked="false" title="Box numbers">
                <svg class="settings-icon settings-number-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <rect x="3" y="5" width="11" height="10" rx="2"></rect>
                  <rect x="18" y="5" width="11" height="10" rx="2"></rect>
                  <rect x="10.5" y="18" width="11" height="10" rx="2"></rect>
                  <text x="8.5" y="12.5">1</text>
                  <text x="23.5" y="12.5">2</text>
                  <text x="16" y="25.5">3</text>
                </svg>
              </button>
              <button class="settings-toggle" type="button" id="roomMemorySetting" role="switch" aria-label="Remember the room" aria-checked="true" title="Remember the room">
                <svg class="settings-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <path d="M5 27V12l11-7 11 7v15M11 27V17h10v10"></path>
                  <path class="settings-icon-fill" d="M13 11h6v4h-6z"></path>
                </svg>
              </button>
              <button class="settings-toggle" type="button" id="soundSetting" role="switch" aria-label="Sounds" aria-checked="true" title="Sounds">
                <svg class="settings-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <path class="settings-icon-fill" d="M5 13h5l7-6v18l-7-6H5z"></path>
                  <path d="M21 11c2.4 2.8 2.4 7.2 0 10M24.5 7.5c4.5 4.7 4.5 12.3 0 17"></path>
                </svg>
              </button>
              <button class="settings-toggle" type="button" id="musicSetting" role="switch" aria-label="Background music" aria-checked="false" title="Background music">
                <svg class="settings-icon" viewBox="0 0 32 32" aria-hidden="true">
                  <path d="M13 22V8l13-3v14"></path>
                  <ellipse class="settings-icon-fill" cx="9" cy="24" rx="4" ry="3"></ellipse>
                  <ellipse class="settings-icon-fill" cx="22" cy="21" rx="4" ry="3"></ellipse>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </header>

      <section class="setup-panel" id="setupPanel">
        <div class="home-smileys" aria-hidden="true">
          <span class="home-smiley home-smiley-one"></span>
          <span class="home-smiley home-smiley-two"></span>
          <span class="home-smiley home-smiley-three"></span>
          <span class="home-smiley home-smiley-four"></span>
          <span class="home-smiley home-smiley-five"></span>
          <span class="home-smiley home-smiley-six"></span>
          <span class="home-smiley home-smiley-seven"></span>
          <span class="home-smiley home-smiley-eight"></span>
        </div>
        <div class="mission-panel" id="missionPanel">
          <p class="home-greeting hidden">Hey, we are in the smileys sorting game :)</p>
          <h2 class="hidden">Choose mission</h2>
          <div class="mission-grid" aria-label="Choose mission">
            <button class="mission-choice feature-mission" type="button" id="featureMissionButton" aria-label="Feature Sort">
              <span class="feature-sort-sketch" aria-hidden="true">
                <span class="choice-sketch sketch-face"></span>
                <span class="feature-square-hat"><span></span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Feature Sort</span>
            </button>
            <button class="mission-choice carroll-mission" type="button" id="carrollMissionButton" aria-label="Two Feature Sort">
              <span class="carroll-sketch" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Two Feature Sort</span>
            </button>
            <button class="mission-choice venn-mission" type="button" id="vennMissionButton" aria-label="Circle Sort">
              <span class="venn-sketch" aria-hidden="true">
                <span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Circle Sort</span>
            </button>
            <button class="mission-choice nested-mission hidden" type="button" id="nestedMissionButton" aria-label="Nested Sets">
              <span class="nested-sketch" aria-hidden="true">
                <span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Nested Sets</span>
            </button>
            <button class="mission-choice selection-mission" type="button" id="selectionMissionButton" aria-label="Select from Venn">
              <span class="selection-sketch" aria-hidden="true">
                <span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Select</span>
            </button>
            <button class="mission-choice simple-compare-mission" type="button" id="simpleCompareMissionButton" aria-label="Easy Compare two smileys">
              <span class="compare-sketch" aria-hidden="true">
                <span></span><strong><span class="relation-symbol-legacy">V</span><span class="relation-pair-icon is-same"><i></i><i></i></span></strong><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Easy Compare</span>
            </button>
            <button class="mission-choice compare-mission" type="button" id="compareMissionButton" aria-label="Compare two smileys">
              <span class="compare-sketch" aria-hidden="true">
                <span></span><strong><span class="relation-symbol-legacy">=</span><span class="relation-pair-icon is-different"><i></i><i></i></span></strong><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Compare</span>
            </button>
            <button class="mission-choice implicit-mission" type="button" id="implicitMissionButton" aria-label="Find the Rule">
              <span class="implicit-sketch" aria-hidden="true">
                <span>?</span><span>?</span>
              </span>
              <span class="mission-word" aria-hidden="true">Find the Rule</span>
            </button>
            <button class="mission-choice counting-mission" type="button" id="countingMissionButton" aria-label="Count circle groups">
              <span class="counting-sketch" aria-hidden="true">
                <span></span><span></span><strong>?</strong>
              </span>
              <span class="mission-word" aria-hidden="true">Counting</span>
            </button>
            <button class="mission-choice creator-mission" type="button" id="creatorMissionButton" aria-label="Create smileys">
              <span class="creator-sketch" aria-hidden="true">
                <span></span><strong>+</strong>
              </span>
              <span class="mission-word" aria-hidden="true">Create</span>
            </button>
            <button class="mission-choice permutation-mission" type="button" id="permutationMissionButton" aria-label="Permutation Album">
              <span class="album-sketch" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Album</span>
            </button>
            <button class="mission-choice pair-combination-mission" type="button" id="pairCombinationMissionButton" aria-label="Pair combinations">
              <span class="pair-combination-sketch" aria-hidden="true">
                <span></span><strong>×</strong><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Pairs</span>
            </button>
            <button class="mission-choice similarity-mission" type="button" id="similarityMissionButton" aria-label="Who is more similar?">
              <span class="similarity-sketch" aria-hidden="true">
                <span class="similarity-sketch-reference"></span>
                <span class="similarity-sketch-choice similarity-sketch-left"></span>
                <strong>?</strong>
                <span class="similarity-sketch-choice similarity-sketch-right"></span>
              </span>
              <span class="mission-word" aria-hidden="true">More Similar?</span>
            </button>
            <button class="mission-choice ordering-mission" type="button" id="orderingMissionButton" aria-label="Order">
              <span class="order-sketch" aria-hidden="true">
                <span class="order-letter">A</span>
                <span class="order-arrow"></span>
                <span class="order-letter">Z</span>
              </span>
              <span class="mission-word" aria-hidden="true">Order</span>
            </button>
            <button class="mission-choice statistics-mission" type="button" id="statisticsMissionButton" aria-label="Statistics">
              <span class="statistics-sketch" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Statistics</span>
            </button>
            <button class="mission-choice average-mission" type="button" id="averageMissionButton" aria-label="Average">
              <span class="average-sketch" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
              <span class="mission-word" aria-hidden="true">Average</span>
            </button>
          </div>
        </div>
        <div class="count-panel hidden" id="countPanel">
          <h2 class="hidden">How many smileys?</h2>
          <div class="count-grid" id="countGrid" aria-label="Choose number of smileys"></div>
        </div>
      </section>

      <section class="work-panel hidden" id="workPanel">
        <div class="tray-wrap">
          <p class="tray-label" id="trayLabel"></p>
          <div class="smiley-tray" id="tray" data-zone="tray"></div>
        </div>

        <div class="sort-table" id="sortTable">
          <div class="column-head with-feature" id="withHeader" aria-label="With the feature"></div>
          <div class="column-head without-feature" id="withoutHeader" aria-label="Without the feature"></div>
          <div class="drop-zone" id="withZone" data-zone="with" aria-label="Smileys with the feature"></div>
          <div class="drop-zone" id="withoutZone" data-zone="without" aria-label="Smileys without the feature"></div>
        </div>

        <div class="similarity-panel hidden" id="similarityPanel">
          <div class="similarity-stage" id="similarityStage" aria-label="Choose the smiley most similar to the reference">
            <div class="similarity-reference" id="similarityReference" aria-label="Reference smiley"></div>
            <div class="similarity-branch" aria-hidden="true">
              <span></span><strong>?</strong><span></span>
            </div>
            <div class="similarity-choices" id="similarityChoices" aria-label="Similarity choices"></div>
          </div>
        </div>

        <div class="ordering-panel hidden" id="orderingPanel">
          <div class="ordering-head">
            <h2 class="panel-title">Order</h2>
            <div class="criteria-list" id="criteriaList" aria-label="Ordering criteria"></div>
          </div>
          <div class="ordering-zone" id="orderingZone" data-zone="order" aria-label="Ordered smileys"></div>
        </div>

        <div class="statistics-panel hidden" id="statisticsPanel">
          <div class="statistics-head">
            <h2 class="panel-title">Statistics</h2>
            <p class="statistics-instruction" id="statisticsInstruction"></p>
          </div>
          <div class="statistics-frequency" id="statisticsFrequency" aria-label="Beard frequency table"></div>
          <div class="statistics-order-wrap">
            <p class="statistics-ranking-direction" id="statisticsRankingDirection"></p>
            <div class="statistics-order-zone" id="statisticsOrderZone" data-zone="statistics-order" aria-label="Ordered statistics smileys"></div>
            <div class="statistics-coin-stage hidden" id="statisticsCoinStage">
              <div class="coin-bank" id="statisticsCoinBank" aria-label="Coin tray"></div>
              <div class="coin-share-row" id="statisticsCoinShares" aria-label="Equal coin shares"></div>
            </div>
          </div>
          <div class="statistics-weighted-table hidden" id="statisticsWeightedTable" aria-label="Weighted average table"></div>
          <p class="statistics-question" id="statisticsQuestion"></p>
          <div class="statistics-answer-row" id="statisticsAnswerRow" aria-label="Statistics answers"></div>
        </div>

        <div class="carroll-panel hidden" id="carrollPanel">
          <div class="carroll-table" id="carrollTable">
            <div class="carroll-corner" aria-hidden="true"></div>
            <div class="carroll-axis top-axis" id="carrollTopWith" aria-label="With first feature"></div>
            <div class="carroll-axis top-axis" id="carrollTopWithout" aria-label="Without first feature"></div>
            <div class="carroll-axis side-axis" id="carrollSideWith" aria-label="With second feature"></div>
            <div class="carroll-zone" id="carrollWithWithZone" data-zone="carroll-with-with" aria-label="Smileys with both features"></div>
            <div class="carroll-zone" id="carrollWithoutWithZone" data-zone="carroll-without-with" aria-label="Smileys without first feature and with second feature"></div>
            <div class="carroll-axis side-axis" id="carrollSideWithout" aria-label="Without second feature"></div>
            <div class="carroll-zone" id="carrollWithWithoutZone" data-zone="carroll-with-without" aria-label="Smileys with first feature and without second feature"></div>
            <div class="carroll-zone" id="carrollWithoutWithoutZone" data-zone="carroll-without-without" aria-label="Smileys without either feature"></div>
          </div>
        </div>

        <div class="compare-panel hidden" id="comparePanel">
          <div class="compare-faces" id="compareFaces" aria-label="Smileys to compare"></div>
          <div class="compare-drag-view" id="compareDragView">
            <div class="compare-column-head compare-bank-head" aria-hidden="true"></div>
            <div class="compare-column-head compare-symbol-head" aria-label="Same"><span class="relation-symbol-legacy">=</span><span class="relation-pair-icon is-same" aria-hidden="true"><i></i><i></i></span></div>
            <div class="compare-column-head compare-symbol-head" aria-label="Different"><span class="relation-symbol-legacy">≠</span><span class="relation-pair-icon is-different" aria-hidden="true"><i></i><i></i></span></div>
            <div class="criteria-bank" id="compareCriteriaBank" data-compare-zone="bank" aria-label="Criteria to compare"></div>
            <div class="compare-columns">
              <div class="compare-drop-zone" id="compareEqualZone" data-compare-zone="equal" aria-label="Equal criteria"></div>
              <div class="compare-drop-zone" id="compareDifferentZone" data-compare-zone="different" aria-label="Different criteria"></div>
            </div>
          </div>
        </div>

        <div class="simple-compare-panel hidden" id="simpleComparePanel">
          <div class="simple-compare-head">
            <h2 class="panel-title">Easy Compare</h2>
            <div class="simple-compare-faces" id="simpleCompareFaces" aria-label="Smileys to compare"></div>
          </div>
          <div class="simple-compare-table" id="simpleCompareTable" aria-label="Easy comparison table"></div>
        </div>

        <div class="permutation-panel hidden" id="permutationPanel">
          <div class="permutation-head">
            <h2 class="panel-title">Album</h2>
          </div>
          <div class="permutation-capture-row">
            <div class="permutation-order-zone" id="permutationOrderZone" data-zone="permutation-order" aria-label="Order smileys for the photo"></div>
            <button class="camera-button" type="button" id="cameraButton" aria-label="Take photo of this order">
              <span aria-hidden="true"></span>
            </button>
          </div>
          <div class="album-pages" id="albumPages" aria-label="Permutation photos"></div>
        </div>

        <div class="pair-combination-panel hidden" id="pairCombinationPanel">
          <div class="permutation-head">
            <h2 class="panel-title">Pairs</h2>
          </div>
          <div class="permutation-source-row" aria-label="Smiley groups">
            <div class="permutation-source-zone" id="pairSourceA" data-zone="pair-source-a" aria-label="First smiley group"></div>
            <div class="permutation-source-zone" id="pairSourceB" data-zone="pair-source-b" aria-label="Second smiley group"></div>
          </div>
          <div class="permutation-capture-row">
            <div class="permutation-order-zone pair-capture-zone" id="pairCaptureZone" data-zone="pair-capture" aria-label="Place one smiley from each group here"></div>
            <button class="camera-button" type="button" id="pairCameraButton" aria-label="Take photo of this pair" disabled>
              <span aria-hidden="true"></span>
            </button>
          </div>
          <div class="album-pages" id="pairAlbumPages" aria-label="Pair combination photos"></div>
        </div>

        <div class="creator-panel hidden" id="creatorPanel">
          <div class="creator-head">
            <h2 class="panel-title">Create</h2>
          </div>
          <div class="creator-layout">
            <div class="creator-bank" id="creatorCriteriaBank" aria-label="Criteria to add"></div>
            <div class="creator-workbench">
              <div class="creator-current-tools">
                <div class="creator-smiley-target" id="creatorSmileyTarget" aria-label="Current smiley"></div>
                <div class="creator-tool-buttons">
                  <button class="creator-reset-button" type="button" id="creatorResetButton" aria-label="Reset current smiley">
                    <span aria-hidden="true"></span>
                  </button>
                  <button class="creator-confirm-button" type="button" id="creatorConfirmButton" aria-label="Add current smiley">
                    <span aria-hidden="true"></span>
                  </button>
                </div>
              </div>
            </div>
            <div class="created-smileys" id="createdSmileys" aria-label="Created smileys"></div>
          </div>
        </div>

        <div class="venn-panel hidden" id="vennPanel">
          <p class="selection-diagram-caption"></p>
          <div class="venn-stage" id="vennStage" aria-label="Three circle sorting diagram">
            <div class="venn-circle circle-a" data-venn-circle="a">
              <button class="venn-circle-head" id="vennAHead" type="button" data-venn-category="a" aria-pressed="false"></button>
            </div>
            <div class="venn-circle circle-b" data-venn-circle="b">
              <button class="venn-circle-head" id="vennBHead" type="button" data-venn-category="b" aria-pressed="false"></button>
            </div>
            <div class="venn-circle circle-c" data-venn-circle="c">
              <button class="venn-circle-head" id="vennCHead" type="button" data-venn-category="c" aria-pressed="false"></button>
            </div>
            <div class="venn-zone zone-a-only" id="vennAZone" data-zone="venn-a" aria-label="Only first feature"></div>
            <div class="venn-zone zone-b-only" id="vennBZone" data-zone="venn-b" aria-label="Only second feature"></div>
            <div class="venn-zone zone-c-only" id="vennCZone" data-zone="venn-c" aria-label="Only third feature"></div>
            <div class="venn-zone zone-ab" id="vennABZone" data-zone="venn-ab" aria-label="First and second features"></div>
            <div class="venn-zone zone-ac" id="vennACZone" data-zone="venn-ac" aria-label="First and third features"></div>
            <div class="venn-zone zone-bc" id="vennBCZone" data-zone="venn-bc" aria-label="Second and third features"></div>
            <div class="venn-zone zone-abc" id="vennABCZone" data-zone="venn-abc" aria-label="All three features"></div>
            <div class="venn-zone zone-outside" id="vennOutsideZone" data-zone="venn-outside" aria-label="Outside all circles"></div>
            <div class="venn-intersection-popup hidden" id="vennIntersectionPopup" role="img"></div>
          </div>
          <div class="selection-panel hidden" id="selectionPanel">
            <div class="selection-stage" id="selectionStage" aria-label="Select from the Venn diagram">
              <div class="selection-source">
                <div class="selection-caption" id="selectionCaption" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="selection-target-zone" id="selectionTargetZone" data-zone="selection-target" aria-label="Selection target"></div>
        </div>

        <div class="nested-panel hidden" id="nestedPanel">
          <div class="nested-stage" id="nestedStage" aria-label="One category completely inside another category">
            <div class="nested-outer-set">
              <div class="nested-category-head nested-outer-head" id="nestedOuterHead" aria-label="Outer category"></div>
              <div class="nested-zone nested-outer-zone" id="nestedOuterZone" data-zone="nested-outer" aria-label="Inside the outer category only"></div>
              <div class="nested-inner-set">
                <div class="nested-category-head nested-inner-head" id="nestedInnerHead" aria-label="Inner category"></div>
                <div class="nested-zone nested-inner-zone" id="nestedInnerZone" data-zone="nested-inner" aria-label="Inside the inner category"></div>
              </div>
            </div>
            <div class="nested-zone nested-outside-zone" id="nestedOutsideZone" data-zone="nested-outside" aria-label="Outside both categories"></div>
          </div>
        </div>

        <div class="implicit-panel hidden" id="implicitPanel">
          <div class="implicit-stage" id="implicitStage" aria-label="Find the hidden circle rule">
            <div class="implicit-circle implicit-circle-a" data-venn-circle="a">
              <button class="implicit-rule-head" type="button" id="implicitAHead" data-venn-category="a" aria-label="Choose left hidden rule" aria-pressed="false"></button>
            </div>
            <div class="implicit-circle implicit-circle-b" data-venn-circle="b">
              <button class="implicit-rule-head" type="button" id="implicitBHead" data-venn-category="b" aria-label="Choose right hidden rule" aria-pressed="false"></button>
            </div>
            <div class="implicit-zone implicit-zone-a" id="implicitAZone" data-zone="implicit-a" aria-label="First hidden circle only"></div>
            <div class="implicit-zone implicit-zone-b" id="implicitBZone" data-zone="implicit-b" aria-label="Second hidden circle only"></div>
            <div class="implicit-zone implicit-zone-ab" id="implicitABZone" data-zone="implicit-ab" aria-label="Both hidden circles"></div>
            <div class="implicit-zone implicit-zone-outside" id="implicitOutsideZone" data-zone="implicit-outside" aria-label="Outside both hidden circles"></div>
            <div class="implicit-choice-list hidden" id="implicitChoiceList" aria-label="Choose hidden rule category"></div>
          </div>
        </div>

        <div class="counting-panel hidden" id="countingPanel">
          <div class="counting-stage" id="countingStage" aria-label="Count circle groups">
            <button class="counting-lab-button" type="button" id="countingLabButton" aria-label="Explore moving circles" title="Explore moving circles">
              <span class="counting-lab-circles" aria-hidden="true"></span>
              <span class="counting-lab-play" aria-hidden="true"></span>
            </button>
            <div class="counting-circle counting-circle-a" data-venn-circle="a">
              <button class="counting-circle-head" id="countingAHead" type="button" data-venn-category="a" aria-pressed="false"></button>
            </div>
            <div class="counting-circle counting-circle-b" data-venn-circle="b">
              <button class="counting-circle-head" id="countingBHead" type="button" data-venn-category="b" aria-pressed="false"></button>
            </div>
            <div class="counting-clue counting-clue-a" id="countingAClue" data-zone="counting-a" aria-label="Left side only"></div>
            <div class="counting-clue counting-clue-ab" id="countingABClue" data-zone="counting-ab" aria-label="Both circles"></div>
            <div class="counting-clue counting-clue-b" id="countingBClue" data-zone="counting-b" aria-label="Right side only"></div>
          </div>
        </div>

        <div class="action-row">
          <div class="counting-prompt" aria-label="Counting directions">
            <p class="counting-question" id="countingQuestion"></p>
            <div class="counting-answer-row" id="countingAnswers" aria-label="Counting answers"></div>
          </div>
          <button class="primary-button submit-sort-button" type="button" id="submitSortButton">OK</button>
        </div>

      </section>

      <footer class="copyright-note">
        <button
          class="copyright-dedication"
          type="button"
          id="copyrightDedication"
          aria-describedby="dedicationTitle"
          title="Dedicated to Michelle Denin"
        >
          <span>Copyright &copy; 2026 Alex Shifrin. All rights reserved.</span>
          <span class="dedication-title" id="dedicationTitle" role="tooltip">Dedicated to Michelle Denin</span>
        </button>
      </footer>
    </main>

    <div class="celebration hidden" id="celebration" aria-live="polite" aria-label="Correct cycle complete">
      <span class="firework firework-one" aria-hidden="true"></span>
      <span class="firework firework-two" aria-hidden="true"></span>
      <span class="firework firework-three" aria-hidden="true"></span>
      <span class="firework firework-four" aria-hidden="true"></span>
    </div>

    <div class="count-check-dialog hidden" id="countCheckDialog" role="dialog" aria-modal="true" aria-labelledby="countCheckTitle">
      <div class="count-check-card">
        <h2 id="countCheckTitle">WANNA CHECK?</h2>
        <div class="count-check-actions">
          <button type="button" class="primary-button" id="skipCountCheckButton">NO, CONTINUE</button>
          <button type="button" class="secondary-button" id="checkCountButton">CHECK</button>
        </div>
      </div>
    </div>

    <div class="venn-motion-lab hidden" id="vennMotionLab" role="dialog" aria-modal="true" aria-label="Moving circles laboratory">
      <div class="venn-motion-lab-card">
        <button class="venn-motion-lab-close" type="button" id="vennMotionLabClose" aria-label="Close moving circles laboratory"></button>
        <div class="venn-motion-lab-stage" id="vennMotionLabStage" aria-label="Two moving circles with fixed smileys">
          <div class="venn-motion-lab-circle venn-motion-lab-circle-a" id="vennMotionLabCircleA"></div>
          <div class="venn-motion-lab-circle venn-motion-lab-circle-b" id="vennMotionLabCircleB"></div>
          <div class="venn-motion-lab-smileys" id="vennMotionLabSmileys"></div>
          <div class="venn-motion-lab-counts" aria-live="polite">
            <span class="venn-motion-count venn-motion-count-a" id="vennMotionCountA"></span>
            <span class="venn-motion-count venn-motion-count-both" id="vennMotionCountBoth"></span>
            <span class="venn-motion-count venn-motion-count-b" id="vennMotionCountB"></span>
          </div>
        </div>
        <div class="venn-motion-lab-controls">
          <button class="venn-motion-play-button" type="button" id="vennMotionPlayButton" aria-label="Play circle movement" aria-pressed="false">
            <span aria-hidden="true"></span>
          </button>
          <label class="venn-motion-slider-row">
            <span class="venn-motion-distance-icon" aria-hidden="true"></span>
            <input type="range" id="vennMotionDistance" min="0" max="100" value="35" aria-label="Circle closeness">
          </label>
          <label class="venn-motion-slider-row">
            <span class="venn-motion-size-icon" aria-hidden="true"></span>
            <input type="range" id="vennMotionSize" min="55" max="100" value="100" aria-label="Green circle size">
          </label>
        </div>
      </div>
    </div>

    <template id="smileyTemplate">
      <button class="smiley" type="button">
        <span class="ear left-ear"></span>
        <span class="ear right-ear"></span>
        <span class="hat"></span>
        <span class="eye left-eye"></span>
        <span class="eye right-eye"></span>
        <span class="mouth"></span>
      </button>
    </template>

    <script type="module" src="app.js?v=ipad-feedback-v228-20260829"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" })
            .then(registration => registration.update())
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
